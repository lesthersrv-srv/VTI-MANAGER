name: Build S24 Ultra Performance APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'S24UltraPerformance/**'
      - '.github/workflows/s24-performance-apk.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        run: gradle -p S24UltraPerformance --no-daemon assembleDebug --stacktrace
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: S24UltraPerformance-debug-apk
          path: S24UltraPerformance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
